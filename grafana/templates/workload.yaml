apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  storageClassName: {{ .Values.storageClass }}
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  resources:
    requests:
      storage: {{ .Values.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml .Values.resources | indent 12 }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSecret }}
                  key: username
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSecret }}
                  key: password
            - name: THANOS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metricsTokenSecret }}
                  key: token
            - name: GF_SERVER_ROOT_URL
              value: https://{{ .Values.host }}
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'false'
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_SECURITY_COOKIE_SECURE
              value: 'true'
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: strict
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: 'false'
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: 'false'
            - name: GF_DASHBOARDS_MIN_REFRESH_INTERVAL
              value: 1m
            - name: SSL_CERT_FILE
              value: /etc/grafana/service-ca/service-ca.crt
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: service-ca
              mountPath: /etc/grafana/service-ca
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: service-ca
          configMap:
            name: grafana-service-ca
