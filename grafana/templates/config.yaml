apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: OpenShift
        uid: openshift
        type: prometheus
        access: proxy
        url: {{ .Values.thanosURL }}
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 30s
          httpHeaderName1: Authorization
          tlsSkipVerify: false
        secureJsonData:
          httpHeaderValue1: 'Bearer $THANOS_TOKEN'
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: cluster
        orgId: 1
        folder: OpenShift
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 60
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
{{ (.Files.Glob "dashboards/*.json").AsConfig | indent 2 }}
